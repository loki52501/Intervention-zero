# Project memory: single source of truth for state across agents and sessions.
# Every orchestrator reads this before starting and updates its own section when a
# milestone changes. Append to `log`, never delete entries (the hook enforces history in CHANGES.md).

project: intervention-zero
pitch: >
  A robot that needs a human every fifth mission isn't autonomous. Intervention Zero
  turns every takeover into a tested, permanent fix.
deadline:
  feature_freeze: "2026-10-11T16:05:00-07:00"
  submission: "2026-10-11T17:00:00-07:00"

decisions:   # agreed with Lokesh during brainstorming, 13:40-13:52
  - id: D1
    what: "3D engine + real physics = MuJoCo (per-incident micro-scenes generated from the site map)"
    fallback: "abstract rule judges behind the same Judge interface; hard cut 15:00 if physics unstable"
  - id: D2
    what: "Actions carry physical params (force N, wait s); MuJoCo decides outcome for door/cart/crowd/spill/barrier"
    rule_judged: [person_down, restricted_shortcut, elevator_out_of_service, low_battery, badge_door, elevator_wait]
  - id: D3
    what: "Option A: 3-layer recursion. Robot <- Fixer (writes harness diffs) <- Coach (rewrites fixer playbook). Same gate judges both."
    locked: "gate thresholds and locked guardrails can never be changed by fixer or coach"
    priority: "coach is built after the first closed loop; first to cut if behind"
  - id: D4
    what: "Raindrop via base Python SDK (raindrop-ai). user_id=robot_id, convo_id=site:day:shift, event=mission|fix_cycle|coach_cycle"
    note: "track_signal signal_type only accepts default|feedback|edit -> self-reports are default signal 'agent_report'"
    budget: "RAINDROP_ENABLED=0 by default; <900 events total; replays/gate never log events"
  - id: D5
    what: "Atlas Agent Engine memory: try in parallel (Lokesh does CLI login); abandon 14:30 if not returning memories"
  - id: D10
    agreed: "15:35 PT with Lokesh; launched 15:45"
    what: >
      One prompt -> any world -> a humanoid fleet learns. Robot = Unitree G1 (MuJoCo Menagerie MJCF) mounted on
      planar base joints base_x/base_y/base_yaw (contract unchanged); legs via parametric gait engine, arms via G1
      shoulder/elbow joints with 2-link IK. WorldSpec v2: terrain (flat/rough hfield/slope/steps/ramp), obstacles,
      hazards, people, lighting, domain randomization (friction U[0.4,1.0], mass x U[0.9,1.1], pushes 5-10 s at
      0.1-1.0 m/s, joint noise U[-0.03,0.03] rad, latency 0-3 steps). Fleet: 2-3 G1s share an Atlas
      fleet_blackboard (hazards, blocked lanes, task claims via findOneAndUpdate) + right-of-way rule. Curriculum:
      world coach promotes spec at held-out >= 80 %, demotes < 50 % (Rudin et al. 2021; OMNI-EPIC loop shape).
    honesty: "locomotion is a gait engine, not a learned walking policy; learning happens at behaviour, environment and fleet level"
    schedule_change: >
      Main compressed D10 timeline to protect the 17:00 submission (non-negotiable 8): robot/world/fleet hard cut
      16:10, loop 16:20, docs + FREEZE 16:30, video/push/submit 16:30-16:55. Lokesh may revert to 16:45.
    cuts: "fleet -> 1 robot no blackboard; loop -> 2 generations; G1 clone fails -> capsule body + capsule legs on same gait engine (say so)"
  - id: D6
    what: "Situation templates cut to 8 solid ones incl. the 4 anchors (fire door D-17, cart C2, server room S-2, renovation drift)"

